<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F7A3D">
<title>La Morelia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --verde:#1F7A3D;
    --verde-osc:#155a2c;
    --fondo:#f1f4ee;
    --texto:#1c2a1f;
    --gris:#9aa39a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--fondo);
    color:var(--texto);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding:24px;
  }
  h1{
    font-size:1.6rem;
    margin:0 0 4px;
    text-align:center;
  }
  p.sub{
    margin:0 0 32px;
    color:#556356;
    text-align:center;
  }
  .menu{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  button.herramienta{
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    padding:22px 20px;
    font-size:1.15rem;
    font-weight:600;
    font-family:inherit;
    color:#fff;
    background:var(--verde);
    border:none;
    border-radius:14px;
    cursor:pointer;
    text-align:left;
  }
  button.herramienta:active{
    background:var(--verde-osc);
  }
  button.herramienta .icono{
    font-size:1.8rem;
    line-height:1;
  }
  button.herramienta[disabled]{
    background:#d8ddd6;
    color:var(--gris);
    cursor:default;
  }
  .etiqueta-proximamente{
    display:block;
    font-size:0.8rem;
    font-weight:400;
    margin-top:2px;
  }
</style>
</head>
<body>

<h1>La Morelia</h1>
<p class="sub">Herramientas de la finca</p>

<div class="menu">
  <button class="herramienta" onclick="location.href='chequeo/index.html'">
    <span class="icono">🐄</span>
    <span>Chequeo reproductivo</span>
  </button>

  <button class="herramienta" disabled>
    <span class="icono">🥛</span>
    <span>
      Lotes de ordeño
      <span class="etiqueta-proximamente">Próximamente</span>
    </span>
  </button>
</div>

<script>
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
  });
}
</script>

</body>
</html>

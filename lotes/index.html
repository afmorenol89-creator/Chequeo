<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F7A3D">
<title>Lotes de ordeño</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="../comun/estilos.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="net" id="net"><span class="pip"></span><span id="netTxt">Con internet</span></div>

<div class="topbar">
  <div class="topbar-in">
    <a href="../index.html" class="icon-btn" aria-label="Inicio">←</a>
    <div>
      <div class="top-title">Lotes de ordeño</div>
      <div class="top-sub">La Morelia</div>
    </div>
  </div>
</div>

<div class="wrap">

  <section id="v-quien" class="oculto">
    <div id="contQuien"></div>
  </section>

  <section id="v-ajustes" class="oculto">
    <div class="card">
      <b>Este dispositivo</b>
      <div class="top-sub" style="margin-bottom:12px">La hoja de Google ya viene configurada en la app.</div>
      <button type="button" class="btn btn-borde" onclick="cambiarUsuario()">Cambiar de usuario</button>
    </div>
    <button type="button" class="btn btn-borde" onclick="irAInicio()">Volver</button>
  </section>

  <section id="v-inicio" class="oculto">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div>
          <div style="font-weight:700;font-size:1.05rem">Hola, <span id="nombreUsuario"></span></div>
          <div class="top-sub">Lotes de ordeño</div>
        </div>
        <button type="button" class="icon-btn" onclick="ver('ajustes')" aria-label="Ajustes">⚙</button>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-bottom:14px">
      <button type="button" class="btn btn-borde" style="margin-bottom:0" onclick="ver('cargar')">📥 Excel</button>
      <button type="button" class="btn btn-borde" style="margin-bottom:0" onclick="iniciarModoRapido()">⚡ Rápido</button>
      <button type="button" class="btn btn-borde" style="margin-bottom:0" onclick="abrirNuevoAnimal()">＋ Nuevo</button>
    </div>

    <div class="campo" style="margin-bottom:6px">
      <input type="text" id="buscador" placeholder="Buscar por número o nombre">
    </div>

    <div id="listaPrincipal"></div>
  </section>

  <section id="v-ficha" class="oculto">
    <div id="fichaCont"></div>
    <button type="button" class="btn btn-borde" style="margin-top:10px" onclick="irAInicio()">Volver</button>
  </section>

  <section id="v-rapido" class="oculto">
    <div id="rapidoCont"></div>
  </section>

  <section id="v-nuevo" class="oculto">
    <div class="card">
      <div class="campo">
        <label>Número (obligatorio)</label>
        <input type="text" inputmode="numeric" id="nuevoNumero" placeholder="Ej. 45">
      </div>
      <div class="campo">
        <label>Nombre (opcional)</label>
        <input type="text" id="nuevoNombre" placeholder="Ej. Vanidosa">
      </div>
      <div class="campo" style="margin-bottom:0">
        <label>Lote (opcional)</label>
        <div class="motivos" id="nuevoLotes"></div>
      </div>
    </div>
    <div id="nuevoAviso"></div>
    <button type="button" class="btn btn-verde" id="btnCrearAnimal" onclick="crearAnimalNuevo()">Crear</button>
    <button type="button" class="btn btn-borde" onclick="irAInicio()">Cancelar</button>
  </section>

  <section id="v-salidas" class="oculto">
    <div class="card"><b>Salidas recientes</b><div class="top-sub">Últimos 30 días</div></div>
    <div id="salidasCont"></div>
    <button type="button" class="btn btn-borde" onclick="irAInicio()">Volver</button>
  </section>

  <section id="v-cargar" class="oculto">
    <div class="drop" id="drop">
      <input type="file" id="archivoExcel" accept=".xlsx,.xls">
      <span class="ic">📄</span>
      <b>Toca o suelta el Excel aquí</b>
      <small>Dos columnas: Número de animal y Nombre</small>
    </div>
    <div id="cargaInfo" style="margin-top:14px"></div>
    <button type="button" class="btn btn-borde" onclick="ver('inicio')" style="margin-top:14px">Cancelar</button>
  </section>

  <section id="v-revision" class="oculto">
    <div class="card" id="resumenRevision"></div>
    <div id="grupoNuevos"></div>
    <div id="grupoNoVienenExcel"></div>
    <div id="grupoManual"></div>
    <button type="button" class="btn btn-verde" id="btnConfirmarRevision" style="margin-top:6px" onclick="confirmarCargaExcel()">Guardar cambios</button>
    <button type="button" class="btn btn-borde" onclick="ver('inicio')">Cancelar</button>
  </section>

  <section id="v-resultado" class="oculto">
    <div class="card" id="resultadoTxt"></div>
    <button type="button" class="btn btn-verde" onclick="ver('inicio')">Listo</button>
  </section>

</div>

<script src="../comun/almacen.js"></script>
<script src="../comun/config.js"></script>
<script src="../comun/sync.js"></script>
<script src="../comun/usuario.js"></script>
<script src="lotes.js"></script>

<script>
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch(e => console.warn('SW', e));
  });
}
</script>

</body>
</html>
